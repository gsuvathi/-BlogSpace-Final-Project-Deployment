<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .blogs {
            max-width: 800px;
            margin: 30px auto;
        }

        .blog {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .blog h2 {
            margin-top: 0;
        }

        .author {
            color: #666;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <h1>My Blog Application</h1>

    <div class="blogs" id="blogs">
        Loading blogs...
    </div>

    <script>
        async function loadBlogs() {

            const response = await fetch("/api/blogs");

            const blogs = await response.json();

            const container = document.getElementById("blogs");

            container.innerHTML = "";

            blogs.forEach(blog => {

                container.innerHTML += `
                    <div class="blog">

                        <h2>${blog.title}</h2>

                        <p class="author">
                            Author: ${blog.author}
                        </p>

                        <p>
                            ${blog.content}
                        </p>

                        <a class="button"
                           href="/blog.html?id=${blog.id}">
                            Read More
                        </a>

                    </div>
                `;
            });
        }

        loadBlogs();
    </script>

</body>
</html>
