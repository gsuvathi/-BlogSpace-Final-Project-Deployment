<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace - Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            BlogSpace
        </div>

        <h1 class="auth-title">
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to continue to your BlogSpace account
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <p
            id="loginMessage"
            style="
                margin-top:15px;
                font-size:14px;
            "
        ></p>


        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </div>

    </div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const message =
            document
                .getElementById("loginMessage");


        try {

            const response =
                await fetch("/api/auth/login", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });


            const data =
                await response.json();


            if (response.ok) {

                /*
                 * Keep the token returned
                 * by your existing backend.
                 */

                localStorage.setItem(
                    "token",
                    data.token
                );


                if (data.user) {

                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );

                }


                message.textContent =
                    "Login successful!";


                setTimeout(function() {

                    window.location.href =
                        "home.html";

                }, 500);

            }

            else {

                message.textContent =
                    data.message ||
                    "Invalid email or password.";

            }

        }

        catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to server.";

        }

    });

</script>

</body>

</html>
