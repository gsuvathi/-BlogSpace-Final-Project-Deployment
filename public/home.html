```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace - Home</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #ffffff;
            color: #1e293b;
            padding: 16px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
        }

        .logo {
            color: #4f46e5;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-links a,
        .nav-links button {
            color: #475569;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 7px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            background: #eef2ff;
            color: #4f46e5;
        }

        /* Active Home */

        .nav-links a:first-child {
            color: #4f46e5;
            font-weight: 600;
        }

        /* Create Blog */

        .create-btn {
            background: #4f46e5 !important;
            color: white !important;
        }

        .create-btn:hover {
            background: #4338ca !important;
            color: white !important;
        }

        /* Logout */

        .logout-btn {
            background: #ef4444 !important;
            color: white !important;
        }

        .logout-btn:hover {
            background: #dc2626 !important;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            text-align: center;
            padding: 80px 20px 70px;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #ffffff
            );
        }

        .hero h1 {
            font-size: 44px;
            color: #0f172a;
            margin-bottom: 18px;
        }

        .hero p {
            max-width: 700px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.7;
            color: #64748b;
        }


        /* =========================
           BLOG SECTION
        ========================= */

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 70px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 32px;
            color: #0f172a;
            margin-bottom: 35px;
        }

        #blogList {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 25px;
        }


        /* =========================
           BLOG CARD
        ========================= */

        .blog-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 25px;
            border: 1px solid #e2e8f0;

            box-shadow:
                0 5px 20px rgba(15, 23, 42, 0.06);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .blog-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 30px rgba(15, 23, 42, 0.10);
        }

        .blog-card h3 {
            margin-bottom: 12px;
            font-size: 22px;
            color: #0f172a;
            line-height: 1.4;
        }

        .category {
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .author {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .content {
            color: #475569;
            line-height: 1.7;
            font-size: 15px;
        }

        .read-more {
            display: inline-block;
            margin-top: 18px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .read-more:hover {
            color: #7c3aed;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            grid-column: 1 / -1;

            text-align: center;
            padding: 35px;

            background: white;

            border-radius: 12px;

            border: 1px solid #e2e8f0;

            color: #64748b;
        }

        .message h3 {
            color: #0f172a;
            margin-bottom: 8px;
        }

        .message p {
            line-height: 1.6;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 30px;

            margin-top: 20px;

            background: #0f172a;

            color: #cbd5e1;
        }

        footer p {
            font-size: 14px;
        }


        /* =========================
           RESPONSIVE DESIGN
        ========================= */

        @media (max-width: 768px) {

            .navbar {
                padding: 15px 20px;

                flex-direction: column;

                gap: 15px;
            }

            .nav-links {
                width: 100%;

                flex-wrap: wrap;

                justify-content: center;
            }

            .hero {
                padding: 65px 20px 55px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .hero p {
                font-size: 16px;
            }

            .container {
                padding: 55px 20px;
            }

            .section-title {
                font-size: 28px;
            }
        }


        @media (max-width: 480px) {

            .logo {
                font-size: 23px;
            }

            .nav-links {
                gap: 5px;
            }

            .nav-links a,
            .nav-links button {
                padding: 8px 10px;
                font-size: 13px;
            }

            .hero h1 {
                font-size: 29px;
            }

            .hero p {
                font-size: 15px;
            }

            #blogList {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <a href="/home.html" class="logo">
            BlogSpace
        </a>


        <div class="nav-links">

            <a href="/home.html">
                Home
            </a>

            <a href="/dashboard.html">
                Dashboard
            </a>

            <a
                href="/create-blog.html"
                class="create-btn">
                Create Blog
            </a>

            <a
                href="/login.html"
                id="loginLink">
                Login
            </a>

            <a
                href="/register.html"
                id="registerLink">
                Register
            </a>

            <button
                id="logoutButton"
                class="logout-btn"
                style="display: none;"
                onclick="logoutUser()">
                Logout
            </button>

        </div>

    </nav>


    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

        <h1>
            Welcome to BlogSpace
        </h1>

        <p>
            Share your ideas. Read interesting articles.
            Connect through stories.
        </p>

    </section>


    <!-- =========================
         BLOG SECTION
    ========================= -->

    <main class="container">

        <h2 class="section-title">
            Latest Articles
        </h2>


        <div id="blogList">

            <div class="message">
                Loading blogs...
            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>
            © 2026 BlogSpace. All rights reserved.
        </p>

    </footer>


    <script>

        /* =====================================================
           LOAD BLOGS
        ===================================================== */

        async function loadBlogs() {

            const blogList =
                document.getElementById("blogList");

            try {

                const response =
                    await fetch("/api/blogs");

                const blogs =
                    await response.json();

                console.log("Blogs:", blogs);


                if (!response.ok) {

                    throw new Error(
                        blogs.message ||
                        "Failed to load blogs"
                    );

                }


                if (!blogs || blogs.length === 0) {

                    blogList.innerHTML = `
                        <div class="message">

                            <h3>
                                No blogs yet
                            </h3>

                            <p>
                                Be the first person
                                to create a blog!
                            </p>

                            <br>

                            <a
                                href="/create-blog.html"
                                class="create-btn"
                                style="
                                    color:white;
                                    padding:10px 18px;
                                    border-radius:6px;
                                    text-decoration:none;
                                    display:inline-block;
                                ">
                                Create Blog
                            </a>

                        </div>
                    `;

                    return;
                }


                blogList.innerHTML = "";


                blogs.forEach(blog => {

                    const shortContent =
                        blog.content.length > 150
                            ? blog.content.substring(0, 150) + "..."
                            : blog.content;


                    const card =
                        document.createElement("div");

                    card.className =
                        "blog-card";


                    card.innerHTML = `

                        <span class="category">
                            ${escapeHtml(blog.category)}
                        </span>

                        <h3>
                            ${escapeHtml(blog.title)}
                        </h3>

                        <p class="author">
                            By ${escapeHtml(blog.author)}
                        </p>

                        <p class="content">
                            ${escapeHtml(shortContent)}
                        </p>

                        <a
                            href="/blog-details.html?id=${blog._id}"
                            class="read-more">
                            Read More →
                        </a>

                    `;


                    blogList.appendChild(card);

                });


            } catch (error) {

                console.error(
                    "Load blogs error:",
                    error
                );


                blogList.innerHTML = `

                    <div class="message">

                        <h3>
                            Unable to load blogs
                        </h3>

                        <p>
                            ${escapeHtml(error.message)}
                        </p>

                    </div>

                `;

            }

        }


        /* =====================================================
           HTML ESCAPE
        ===================================================== */

        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        function logoutUser() {

            localStorage.removeItem("token");

            localStorage.removeItem("user");

            window.location.href =
                "/login.html";

        }


        /* =====================================================
           CHECK LOGIN
        ===================================================== */

        function checkLogin() {

            const token =
                localStorage.getItem("token");


            const loginLink =
                document.getElementById("loginLink");


            const registerLink =
                document.getElementById("registerLink");


            const logoutButton =
                document.getElementById("logoutButton");


            if (token) {

                loginLink.style.display =
                    "none";

                registerLink.style.display =
                    "none";

                logoutButton.style.display =
                    "inline-block";

            } else {

                loginLink.style.display =
                    "inline-block";

                registerLink.style.display =
                    "inline-block";

                logoutButton.style.display =
                    "none";

            }

        }


        /* =====================================================
           PAGE LOAD
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                checkLogin();

                loadBlogs();

            }
        );

    </script>


</body>

</html>
