<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - BlogSpace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        nav {
            background: #222;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 25px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #blogMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav>
    <h2>BlogSpace</h2>

    <div>
        <a href="/home.html">Home</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/create-blog.html">Create Blog</a>
        <a href="/login.html">Login</a>
    </div>
</nav>

<div class="container">

    <h1>Create New Blog</h1>

    <form id="createBlogForm">

        <label for="blogTitle">Blog Title</label>
        <input
            type="text"
            id="blogTitle"
            name="title"
            placeholder="Enter blog title"
            required
        >

        <label for="blogCategory">Category</label>
        <select id="blogCategory" name="category" required>
            <option value="">Select Category</option>
            <option value="Technology">Technology</option>
            <option value="Development">Development</option>
            <option value="Education">Education</option>
            <option value="Career">Career</option>
            <option value="Lifestyle">Lifestyle</option>
        </select>

        <label for="blogContent">Blog Content</label>
        <textarea
            id="blogContent"
            name="content"
            placeholder="Write your blog content here..."
            required
        ></textarea>

        <button type="submit" id="createBlogButton">
            Publish Blog
        </button>

        <div id="blogMessage"></div>

    </form>

</div>

<script src="/js/create-blog.js"></script>

</body>
</html>
