<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Blog - BlogSpace</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">BlogSpace</div>

        <div class="nav-links">
            <a href="/home.html">Home</a>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/create-blog.html">Create Blog</a>
        </div>
    </nav>

    <div class="container">

        <h1>Edit Blog</h1>

        <form id="editForm">

            <div class="form-group">
                <label for="blogTitle">Title</label>
                <input
                    type="text"
                    id="blogTitle"
                    name="title"
                    required
                >
            </div>

            <div class="form-group">
                <label for="blogCategory">Category</label>

                <select id="blogCategory" name="category" required>
                    <option value="">Select Category</option>
                    <option value="Technology">Technology</option>
                    <option value="Development">Development</option>
                    <option value="Education">Education</option>
                    <option value="Career">Career</option>
                    <option value="Lifestyle">Lifestyle</option>
                </select>
            </div>

            <div class="form-group">
                <label for="blogContent">Content</label>

                <textarea
                    id="blogContent"
                    name="content"
                    rows="10"
                    required
                ></textarea>
            </div>

            <button type="submit" id="updateBlogButton">
                Update Blog
            </button>

            <p id="editMessage"></p>

        </form>

    </div>

    <script src="/js/edit-blog.js"></script>

</body>
</html>
